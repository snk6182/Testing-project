name: Java Application Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Clean Package
        run: mvn clean package
      - name: Check Docker Username
        run: |
         if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
         echo "DOCKER_USERNAME is EMPTY"
         exit 1
         else
         echo "DOCKER_USERNAME is configured"
         fi

         if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
         echo "DOCKER_PASSWORD is EMPTY"
         exit 1
         else
         echo "DOCKER_PASSWORD is configured"
         fi  

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/testproject5:v1 .

      - name: Docker Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/testproject5:v1

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/testproject5:v1

            docker stop testproject5 || true
             docker rm testproject5|| true
  
            docker run -d --name testproject5 -p 8083:8080 ${{ secrets.DOCKER_USERNAME }}/testproject5:v1

            docker ps







            
